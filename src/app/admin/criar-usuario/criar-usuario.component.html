<div class="form-container">
  <h2>Criar Novo Usuário</h2>

  <form (ngSubmit)="criarUsuario()">
    <div class="form-group">
      <label>Nome:</label>
      <input type="text" [(ngModel)]="usuario.nome" name="nome" required>
    </div>

    <div class="form-group">
      <label>Email:</label>
      <input type="email" [(ngModel)]="usuario.email" name="email" required>
    </div>

    <div class="form-group">
      <label>Senha:</label>
      <input type="password" [(ngModel)]="usuario.senha" name="senha" required>
    </div>

    <div class="form-group">
      <label>Perfil:</label>
      <select [(ngModel)]="usuario.perfil" name="perfil" required>
        <option [ngValue]="true">Admin</option>
        <option [ngValue]="false">Cliente</option>
      </select>
    </div>

    <button type="submit" class="btn btn-success">Salvar</button>
    <button type="button" class="btn btn-secondary" (click)="voltar()">Cancelar</button>
  </form>
</div>
