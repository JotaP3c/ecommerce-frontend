<div class="form-container">
  <h2>Novo Produto</h2>

  <form (ngSubmit)="criarProduto()" #produtoForm="ngForm">
    <div class="form-group">
      <label>Nome:</label>
      <input type="text" [(ngModel)]="produto.nome" name="nome" required />
    </div>

    <div class="form-group">
      <label>Descrição:</label>
      <input type="text" [(ngModel)]="produto.descricao" name="descricao" required />
    </div>

    <div class="form-group">
      <label>Imagem:</label>
      <input type="file" (change)="onFileSelected($event)" />
    </div>

    <div class="form-group">
      <label>Preço:</label>
      <input type="number" [(ngModel)]="produto.preco" name="preco" required min="1" />
    </div>

    <button type="submit" class="btn btn-success" [disabled]="carregando">Salvar</button>
    <button type="button" class="btn btn-secondary" (click)="voltar()">Cancelar</button>
  </form>
</div>
