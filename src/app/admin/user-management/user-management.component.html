<div class="container">
  <h2>Gerenciamento de Usuários</h2>

  <div class="search-bar">
    <input [(ngModel)]="termoBusca" placeholder="Digite o termo de busca" />
    <select [(ngModel)]="filtroTipo">
      <option value="nome">Nome</option>
      <option value="email">Email</option>
      <option value="id">ID</option>
      <option value="perfil">Perfil (Admin/Cliente)</option>
    </select>
    <button class="btn-info" (click)="buscar()">Buscar</button>
    <button class="btn-voltar" (click)="voltar()">Voltar</button>
    <button class="btn-success" (click)="irParaCriarUsuario()">Criar Usuário</button>
  </div>

  <div class="table-wrapper" (scroll)="onScroll($event)">
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Nome</th>
          <th>Email</th>
          <th>Perfil</th>
          <th>Status</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let usuario of usuarios" [ngClass]="{'inativo': !usuario.ativo}">
          <td>{{ usuario.id }}</td>
          <td>{{ usuario.nome }}</td>
          <td>{{ usuario.email }}</td>
          <td>{{ usuario.perfil ? 'Admin' : 'Cliente' }}</td>
          <td>{{ usuario.ativo ? 'Ativo' : 'Inativo' }}</td>
          <td>
            <button class="btn btn-info" (click)="editarUsuario(usuario)">Editar</button>
            <button *ngIf="usuario.ativo" class="btn-danger" (click)="desativarUsuario(usuario.id)">Desativar</button>
            <button *ngIf="!usuario.ativo" class="btn-success" (click)="ativarUsuario(usuario.id)">Ativar</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Modal de edição -->
  <div *ngIf="editando" class="modal">
    <div class="modal-content">
      <h3>Editar Usuário</h3>

      <div class="form-group">
        <label>Nome</label>
        <input [(ngModel)]="editando.nome" />
      </div>

      <div class="form-group">
        <label>Email</label>
        <input [(ngModel)]="editando.email" />
      </div>

      <div class="form-group">
        <label>Perfil</label>
        <select [(ngModel)]="editando.perfil">
          <option [value]="true">Admin</option>
          <option [value]="false">Cliente</option>
        </select>
      </div>

      <div class="actions">
        <button class="btn-success" (click)="salvarEdicao()">Salvar</button>
        <button class="btn-voltar" (click)="cancelarEdicao()">Cancelar</button>
      </div>
    </div>
  </div>
</div>
