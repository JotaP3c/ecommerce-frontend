<div class="scroll-container">
  
<div class="container">
    <h2>Editar Produto</h2>
  
    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>Descrição</th>
            <th>Preço</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let produto of produtos">
            <td>{{ produto.id }}</td>
            <td>
              <input [(ngModel)]="produto.nome" type="text" />
            </td>
            <td>
              <input [(ngModel)]="produto.descricao" type="text" />
            </td>
            <td>
              <input [(ngModel)]="produto.preco" type="number" min="0" />
            </td>
            <td>
              <button class="btn btn-success" (click)="salvar(produto)">Salvar</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  
    <button class="btn-voltar" (click)="voltar()">Voltar</button>
  </div>

</div>
